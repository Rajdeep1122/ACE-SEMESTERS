{% extends 'blog/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login to Your Account</h2>
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="username" id="id_username" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" id="id_password" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        {% if form.errors %}
            <p class="text-red-500 text-sm mt-4">Your username and password didn't match. Please try again.</p>
        {% endif %}
        <div class="mt-6">
            <button type="submit" class="w-full bg-blue-600 text-white rounded-lg px-4 py-2 text-lg font-semibold hover:bg-blue-700 transition duration-300">Login</button>
        </div>
    </form>
    <p class="text-center text-sm text-gray-600 mt-4">
        Don't have an account? <a href="{% url 'signup' %}" class="font-medium text-blue-600 hover:underline">Sign up</a>
    </p>
</div>
{% endblock %}

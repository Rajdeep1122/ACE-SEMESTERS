<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE Semesters</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <nav class="bg-white border-b border-gray-200 shadow-sm">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% url 'home' %}" class="font-bold text-2xl text-blue-600">ACE Semesters</a>
            <div>
                {% if user.is_authenticated %}
                    <a href="{% url 'post_create' %}" class="bg-blue-600 text-white rounded-lg px-4 py-2 hover:bg-blue-700 transition duration-300">New Post</a>
                    <a href="{% url 'logout' %}" class="ml-4 text-gray-600 hover:text-blue-600">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-gray-600 hover:text-blue-600">Login</a>
                    <a href="{% url 'signup' %}" class="ml-4 bg-blue-600 text-white rounded-lg px-4 py-2 hover:bg-blue-700 transition duration-300">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white mt-8 py-4">
        <div class="container mx-auto px-6 text-center text-gray-500">
            <p>&copy; {% now "Y" %} ACE Semesters. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>

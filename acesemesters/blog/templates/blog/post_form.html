{% extends 'blog/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
    {% if form.instance.pk %}
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Edit Post</h1>
    {% else %}
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Create a New Post</h1>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="space-y-6">
            <div>
                <label for="{{ form.title.id_for_label }}" class="block text-sm font-medium text-gray-700">Title</label>
                {{ form.title }}
            </div>
            <div>
                <label for="{{ form.category.id_for_label }}" class="block text-sm font-medium text-gray-700">Category</label>
                {{ form.category }}
            </div>
            <div>
                <label for="{{ form.content.id_for_label }}" class="block text-sm font-medium text-gray-700">Content</label>
                {{ form.content }}
            </div>
        </div>
        <div class="mt-8">
            <button type="submit" class="w-full bg-blue-600 text-white rounded-lg px-4 py-2 text-lg font-semibold hover:bg-blue-700 transition duration-300">
                Save Post
            </button>
        </div>
    </form>
</div>
{% endblock %}

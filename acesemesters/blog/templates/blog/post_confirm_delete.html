{% extends 'blog/base.html' %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-md text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Delete Post</h1>
    <p class="text-gray-600 mb-6">Are you sure you want to delete the post titled "{{ post.title }}"?</p>
    <form method="POST">
        {% csrf_token %}
        <div class="flex justify-center gap-4">
            <button type="submit" class="bg-red-600 text-white rounded-lg px-6 py-2 hover:bg-red-700 transition duration-300">Confirm Delete</button>
            <a href="{% url 'post_detail' post.pk %}" class="bg-gray-200 text-gray-800 rounded-lg px-6 py-2 hover:bg-gray-300 transition duration-300">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
